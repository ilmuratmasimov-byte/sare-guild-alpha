name: Android alpha

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.SARE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SARE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SARE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SARE_KEY_PASSWORD }}
          FIREBASE_API_KEY: ${{ secrets.SARE_FIREBASE_API_KEY }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing SARE_KEYSTORE_BASE64"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Missing SARE_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing SARE_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Missing SARE_KEY_PASSWORD"; exit 1; }
          test -n "$FIREBASE_API_KEY" || { echo "Missing SARE_FIREBASE_API_KEY"; exit 1; }

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SARE_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sare-release.jks"

      - name: Validate version
        shell: bash
        run: |
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r')"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')"
          test "$VERSION_CODE" -ge 1
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION_NAME" ]]; then
            echo "Tag must be v$VERSION_NAME"
            exit 1
          fi

      - name: Build signed release APK
        env:
          SARE_KEYSTORE_PATH: ${{ runner.temp }}/sare-release.jks
          SARE_KEYSTORE_PASSWORD: ${{ secrets.SARE_KEYSTORE_PASSWORD }}
          SARE_KEY_ALIAS: ${{ secrets.SARE_KEY_ALIAS }}
          SARE_KEY_PASSWORD: ${{ secrets.SARE_KEY_PASSWORD }}
          SARE_FIREBASE_API_KEY: ${{ secrets.SARE_FIREBASE_API_KEY }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and prepare artifacts
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          VERSION_CODE="$(sed -n 's/^VERSION_CODE=//p' version.properties | tr -d '\r')"
          VERSION_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties | tr -d '\r')"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SARE-Guild.apk
          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then RELEASE_TAG="v$VERSION_NAME"; fi
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/SARE-Guild.apk"
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg apkUrl "$APK_URL" \
            '{versionCode:$versionCode,versionName:$versionName,apkUrl:$apkUrl}' > dist/version.json

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SARE-Guild-${{ github.sha }}
          path: |
            dist/SARE-Guild.apk
            dist/version.json
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "SARE Guild $GITHUB_REF_NAME" --notes "Signed Android alpha build."
          fi
          gh release upload "$GITHUB_REF_NAME" dist/SARE-Guild.apk dist/version.json --clobber

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/sare-release.jks"

